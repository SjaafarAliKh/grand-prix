<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Prix 🏎️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">
    <script defer src="./app.js"></script>
</head>

<body>
    <main class="game">
        <section class="hud">
            <div>
                <small>DISTANCE</small>
                <b><span id="distance">0</span>m</b>
            </div>
            <div>
                <small>SPEED</small>
                <b class="cyan"><span id="speed"></span>KM/H</b>
            </div>

            <div>
                <small>LIVES</small>
                <b id="lives"></b>
            </div>
        </section>

        <section class="bar">
            <div class="track">
                <div id="progress"></div>
            </div>
            <span>SCORE:<b id="score">0</b></span>
            <span>BEST:<b id="best">0</b></span>
            <button id="pause" title="Pause (P)">II</button>
            <button id="sound" title="Sound">SFX ON</button>
            <button id="theme" title="Dark / Light">THEME</button>
        </section>


        <section class="stage">
            <canvas id="road" width="360" height="600"></canvas>

            <div id="overlay">
                <h1 id="overlay-title">GRAND PRIX</h1>
                <p id="overlay-text"></p>
                <select>
                    <option value="easy">Easy</option>
                    <option value="normal" selected>Normal</option>
                    <option value="hard">Hard</option>
                </select>
                <button id="start">START ENGINE</button>
            </div>
        </section>


    </main>




</body>

</html>
